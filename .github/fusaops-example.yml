# Example: run FuSaOps multi-language safety checks in your own repository.
#
# The reusable action wraps the all-in-one Docker image — no local Go
# installation or tool setup required.  Copy this job into your
# .github/workflows/ci.yml and adjust the inputs as needed.
#
# Full input reference: .github/actions/fusaops/action.yml

name: Safety Checks (example)

on: [push, pull_request]

jobs:
  # ── Minimal: check every language present, fail on any ERROR finding ──────
  safety-check:
    name: FuSaOps check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: SoundMatt/FuSaOps/.github/actions/fusaops@v0.5.1
        # Default command is "check". No further config needed.

  # ── Strict: also fail on WARNING findings; upload HTML evidence report ─────
  safety-strict:
    name: FuSaOps check (strict) + report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: SoundMatt/FuSaOps/.github/actions/fusaops@v0.5.1
        with:
          args: '--strict'
          upload-report: 'true'

  # ── Traceability gate: fail if any requirement is untraced or untested ─────
  safety-trace:
    name: FuSaOps trace (strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: SoundMatt/FuSaOps/.github/actions/fusaops@v0.5.1
        with:
          command: trace
          args: '--strict'

  # ── Audit evidence: bundle audit-pack.zip for archiving ───────────────────
  safety-audit-pack:
    name: FuSaOps audit-pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: SoundMatt/FuSaOps/.github/actions/fusaops@v0.5.1
        with:
          command: audit-pack
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audit-pack
          path: audit-pack.zip
          if-no-files-found: warn
