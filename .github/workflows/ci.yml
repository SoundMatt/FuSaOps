name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Build and unit tests ──────────────────────────────────────────────────
  test:
    name: Test (${{ matrix.os }}, Go ${{ matrix.go }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-2025]
        go: ["1.22", "1.23"]
        exclude:
          # Go 1.22's race-detector test binaries lack LC_UUID, which macOS 26
          # (Tahoe) dyld rejects. Go 1.22 is still tested on ubuntu + windows.
          - os: macos-latest
            go: "1.22"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}

      - name: go vet
        shell: bash
        run: go vet ./...

      - name: go test (-race)
        shell: bash
        run: go test -race -count=1 -coverprofile=coverage.out ./...

  # ── Coverage gate (>= 80%) ────────────────────────────────────────────────
  # Standalone required job so the gate is independent of the OS/Go test matrix:
  # renaming/skipping a matrix cell can never silently remove the coverage check.
  coverage:
    name: Coverage gate (>= 80%)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.22"

      - name: go test (coverage)
        shell: bash
        run: go test -count=1 -coverprofile=coverage.out ./...

      - name: Enforce coverage threshold
        shell: bash
        run: |
          pct=$(go tool cover -func=coverage.out | awk '/^total:/{gsub(/%/,"",$3); print $3}')
          printf "Coverage: %.1f%%\n" "$pct"
          awk -v p="$pct" 'BEGIN{ if (p+0 < 80) { print "FAIL: coverage " p "% below 80% threshold"; exit 1 } print "PASS" }'

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

  # ── Lint ──────────────────────────────────────────────────────────────────
  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.22"
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.1.6
          args: --timeout=5m

  # ── go-FuSa self-check (dogfooding) ───────────────────────────────────────
  # FuSaOps orchestrates the x-FuSa toolchain, so its own Go source is gated by
  # go-FuSa exactly as a downstream Go project would be.
  gofusa:
    name: go-FuSa self-check
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.22"

      - name: Install gofusa
        run: go install github.com/SoundMatt/go-FuSa/cmd/gofusa@latest

      - name: gofusa check (gate on ERROR findings)
        run: gofusa check --format json --output gofusa-check-report.json

      - name: gofusa report (evidence)
        continue-on-error: true
        run: gofusa report --format html --output gofusa-report.html

      - name: Upload go-FuSa evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gofusa-evidence
          path: |
            gofusa-check-report.json
            gofusa-report.html

  # ── SARIF upload (GitHub Code Scanning) ───────────────────────────────────
  # Surfaces go-FuSa's findings on FuSaOps's own source in the Security tab.
  sarif:
    name: SARIF upload
    runs-on: ubuntu-latest
    needs: test
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.22"
      - name: Install gofusa
        run: go install github.com/SoundMatt/go-FuSa/cmd/gofusa@latest
      - name: Generate SARIF
        continue-on-error: true
        run: gofusa check --format sarif --output results.sarif
      - name: Upload SARIF to GitHub Code Scanning
        if: hashFiles('results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif

  # ── Docker build verification ─────────────────────────────────────────────
  # The image copies gofusa out of ghcr.io/soundmatt/go-fusa, so the build needs
  # GHCR read access. Tool images are linux/amd64.
  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v5
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build Docker image
        run: docker build --platform linux/amd64 --pull --tag fusaops:ci .
      - name: Smoke-test fusaops in image
        run: docker run --rm --platform linux/amd64 fusaops:ci version
      - name: Smoke-test bundled gofusa
        run: docker run --rm --platform linux/amd64 --entrypoint gofusa fusaops:ci version
