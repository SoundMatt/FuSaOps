version: "2"

run:
  timeout: 5m

linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - ineffassign
    - copyloopvar
    - misspell
    - bodyclose
    - noctx
  settings:
    errcheck:
      check-type-assertions: true
      exclude-functions:
        - (io.Closer).Close
        - (*os.File).Close
        - os.Remove
        - fmt.Fprintf
        - fmt.Fprintln
        - fmt.Fprint
    govet:
      enable-all: true
      disable:
        - fieldalignment
  exclusions:
    rules:
      - path: _test\.go
        text: "Close.*is not checked"
        linters: [errcheck]
      # Test code legitimately uses net.Listen / httptest.NewRequest / Client.Get
      # without a caller-supplied context; noctx targets production code.
      - path: _test\.go
        linters: [noctx]

formatters:
  enable:
    - gofmt
