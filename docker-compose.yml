# FuSaOps docker-compose — zero-install dashboard for the mounted project.
#
#   docker compose up
#   open http://localhost:8080
#
# Pulls the published all-in-one image (bundles the x-FuSa tools). To build
# locally instead, comment out `image:` and uncomment `build:`.
services:
  fusaops:
    image: ghcr.io/soundmatt/fusaops:latest
    platform: linux/amd64
    # build: .
    command: ["serve", "--addr", ":8080", "--dir", "/project"]
    ports:
      - "8080:8080"
    volumes:
      - ".:/project:ro"
